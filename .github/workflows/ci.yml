name: Foundation CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  foundation:
    name: Composer and PHP foundation checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo, openssl
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict --no-interaction

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Validate PSR-4 autoloading
        run: composer dump-autoload --strict-psr --no-interaction

      - name: Syntax-check tracked PHP files
        shell: bash
        run: |
          while IFS= read -r file; do
            php -l "$file"
          done < <(git ls-files '*.php')

      - name: Run PHPUnit tests
        run: composer test
